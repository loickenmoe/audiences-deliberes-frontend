# SonarQube analysis of the frontend (bank quality gate: AFB_ANGULAR_PROJECT).
# The server URL and token are passed on the command line, never stored here.
sonar.projectKey=audiences-deliberes-frontend
sonar.projectName=Audiences et Deliberes - Frontend
sonar.projectVersion=1.0

# Sources are UTF-8 (French text); without this the scanner uses the platform charset on Windows
# and reports shifted, garbled locations.
sonar.sourceEncoding=UTF-8

sonar.sources=app,components,hooks,i18n,lib,providers,services,types,middleware.ts
sonar.tests=tests
# api.generated.ts is produced by openapi-typescript from the backend contract (not hand-written).
sonar.exclusions=**/*.d.ts,types/api.generated.ts

# Coverage from `npm run test:coverage` (Vitest, V8 provider, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
